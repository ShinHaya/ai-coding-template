name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check managed and generated files
        run: node scripts/ai-template.mjs check
      - name: Run managed tests
        run: node scripts/ai-template.mjs test
      - name: Run Issue worktree lifecycle tests
        run: bash scripts/test-issue-worktree.sh
